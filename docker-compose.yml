services:
  db:
    # arm64-сборка PostGIS (нативно на Apple Silicon; та же, что в кластере).
    # На Intel-хосте заменить на postgis/postgis:16-3.4.
    image: imresamu/postgis-arm64:16-3.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-masks}
      POSTGRES_USER: ${POSTGRES_USER:-masks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-masks}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Миграции применяются по порядку при первой инициализации тома.
      - ./deploy/helm/spatial-masks/files/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-masks}"]
      interval: 5s
      timeout: 5s
      retries: 10

  tiles:
    image: ghcr.io/maplibre/martin:v0.13.0
    depends_on:
      db:
        condition: service_healthy
    # Без config-файла: martin авто-публикует таблицы с геометрией и функции-тайлы.
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-masks}:${POSTGRES_PASSWORD:-masks}@db:5432/${POSTGRES_DB:-masks}
    ports:
      - "${MARTIN_PORT:-3000}:3000"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-masks}:${POSTGRES_PASSWORD:-masks}@db:5432/${POSTGRES_DB:-masks}
      TILES_BASE_URL: http://localhost:${MARTIN_PORT:-3000}
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build: ./apps/web
    depends_on:
      - api
      - tiles
    ports:
      - "${WEB_PORT:-5173}:80"

  # Разовая загрузка данных: docker compose run --rm etl
  # Не стартует с `up` (профиль tools). Нужны файлы в ./data (parquet, gpkg).
  etl:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.etl
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-masks}:${POSTGRES_PASSWORD:-masks}@db:5432/${POSTGRES_DB:-masks}
    volumes:
      - ./data:/app/data:ro

volumes:
  pgdata:
