distances:
  city_sigma_km: 10.0
  center_sigma_km: 30.0

composition:
  # Методология подбора весов — см. src/masks/weighting.py.
  #
  # 1. Вес маски regression = r2 показателя (см. indicators выше). R² — прямая
  #    эмпирическая мера того, какую долю дисперсии объясняет калибровка на
  #    87 регионах; чем она выше, тем больше доверия маске. Для показателей
  #    без калибровки (нет в regression.ELASTICITIES) маска не участвует.
  #
  # 2. Остаток бюджета (1 - r2, либо весь 1.0, если regression не участвует)
  #    делится между "общими" масками-прокси (всегда) и "промышленными"
  #    (только для category: industrial).
  #
  # 3. Внутри каждой группы бюджет делится по приорам ниже — обоснование
  #    у каждого числа в комментарии.

  # доля остатка, уходящая промышленным маскам, когда они применимы.
  # Явное допущение, а не эмпирический результат: муниципальных данных для
  # точной калибровки этого соотношения нет (см. README_part2.md, "Ограничения").
  # Если появятся данные для валидации на уровне подрегиона — пересчитать.
  industrial_budget_share: 0.5

  proxy_priors:
    # самый прямой и гранулярный сигнал общей активности (растр WorldPop 100 м)
    worldpop: 0.60
    # агломерационный эффект (доступ к рынкам/труду), не покрыт одной плотностью
    distance_to_city: 0.25
    # частично дублирует worldpop/distance_to_city — региональный центр обычно
    # и есть самый населённый город региона, поэтому наименьший приор
    distance_to_center: 0.15

  industrial_priors:
    # прямой сигнал пригодности площадки — реальный класс землепользования
    territory: 0.30
    # логистика общего назначения — нужна практически любому производству
    road_network: 0.25
    # логистика тяжёлых/навалочных грузов — уже по применимости, чем road_network
    railway: 0.20
    # энергоёмкость критична не для всех производств, поэтому ниже
    power: 0.15
    # частично дублирует road_network и distance_to_city (тоже про доступ по
    # дорогам) — наименьший приор, чтобы не считать один сигнал трижды
    road_traveltime: 0.10

regions:
  Москва: "data/processed/grid_moscow_1km_features.gpkg"
  Краснодар: "data/processed/grid_krasnodar_1km_features.gpkg"
  Якутия: "data/processed/grid_yakutia_center_1km_features.gpkg"
