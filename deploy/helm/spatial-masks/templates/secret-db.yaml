{{- if not .Values.postgres.existingSecret }}
{{- if not .Values.postgres.password }}
{{- fail "Задайте postgres.password или postgres.existingSecret" }}
{{- end }}
# Секрет с паролем в текущем ns (секреты не читаются cross-ns, поэтому даже для
# внешнего Postgres пароль должен лежать здесь — либо задайте existingSecret).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spatial-masks.fullname" . }}-db
  labels:
    {{- include "spatial-masks.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
{{- end }}
