apiVersion: v1
kind: Service
metadata:
  name: {{ include "spatial-masks.fullname" . }}-api
  labels:
    {{- include "spatial-masks.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spatial-masks.fullname" . }}-api
  labels:
    {{- include "spatial-masks.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "spatial-masks.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          env:
            {{- include "spatial-masks.dbEnv" (dict "ctx" . "scheme" "postgresql+psycopg") | nindent 12 }}
            - name: TILES_BASE_URL
              value: "{{ include "spatial-masks.publicBase" . }}/tiles"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
