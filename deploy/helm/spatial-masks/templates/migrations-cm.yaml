{{- if .Values.migrate.enabled }}
# SQL-миграции из files/migrations/. Монтируются в migrate-Job (и в initdb
# встроенной БД при postgres.deploy=true). Ключи = имена файлов → порядок по имени.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spatial-masks.fullname" . }}-migrations
  labels:
    {{- include "spatial-masks.labels" . | nindent 4 }}
  annotations:
    # Хук-ресурс с весом < migrate-Job (-5): создаётся раньше, чтобы Job его смонтировал.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
{{ (.Files.Glob "files/migrations/*.sql").AsConfig | indent 2 }}
{{- end }}
