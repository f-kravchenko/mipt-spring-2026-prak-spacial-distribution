server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Локальный docker-compose: проксируем /api на сервис api (тот же origin).
    # В k8s эта локация не используется (apiBase = публичный URL, см. ConfigMap),
    # но имя `api` там не резолвится. Поэтому адрес — через переменную + resolver:
    # nginx резолвит upstream В МОМЕНТ ЗАПРОСА, а не при старте, и не падает,
    # если имени нет (иначе CrashLoopBackOff). 127.0.0.11 — встроенный DNS Docker.
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_upstream api;
        proxy_pass http://$api_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html и runtime-конфиг не кэшируем: без Cache-Control браузеры
    # кэшируют их эвристикой по Last-Modified и после деплоя продолжают
    # грузить СТАРЫЙ бандл (hard-reload не всегда спасает). Хэшированные
    # ассеты, наоборот, неизменяемы — кэш на год.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /config.js {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: все маршруты отдаём в index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
