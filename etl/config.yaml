# Конфиг ETL: пути к исходным данным и параметры загрузки в PostGIS.
# Нет абсолютных путей — всё относительно корня репозитория.

rosstat_parquet: "data/raw/Массив Данных в формате Parquet/Показатели по регионам.parquet"
year: 2023

# object_name в parquet -> файлы сетки и границы + slug для БД
regions:
  - slug: moscow
    name: "Московская область"
    object_name: "Московская область"
    grid: "data/processed/grid_moscow_1km_features.gpkg"
    border: "data/processed/border_mo.gpkg"
    cities: "data/processed/cities_moscow.csv"
    roads: "data/processed/graphs/roads_moscow.graphml"
    traveltime: "data/processed/traveltime_moscow.csv"
    railway: "data/processed/railway_moscow.csv"
    power: "data/processed/power_moscow.csv"
    territory: "data/processed/territory_moscow.csv"
    science: "data/processed/science_moscow.csv"
  - slug: krasnodar
    name: "Краснодарский край"
    object_name: "Краснодарский край"
    grid: "data/processed/grid_krasnodar_1km_features.gpkg"
    border: "data/processed/border_krasnodar.gpkg"
    cities: "data/processed/cities_krasnodar.csv"
    roads: "data/processed/graphs/roads_krasnodar.graphml"
    # csv посчитан и валиден (185691 строка = сетка края), но ссылки на него не
    # было — Краснодар оставался единственным регионом без маски времени в пути
    traveltime: "data/processed/traveltime_krasnodar.csv"
    railway: "data/processed/railway_krasnodar.csv"
    power: "data/processed/power_krasnodar.csv"
    territory: "data/processed/territory_krasnodar.csv"
    science: "data/processed/science_krasnodar.csv"
  - slug: yakutia_center
    name: "Республика Саха (Якутия), центр"
    object_name: "Республика Саха (Якутия)"
    grid: "data/processed/grid_yakutia_center_1km_features.gpkg"
    border: "data/processed/border_ya_center.gpkg"
    cities: "data/processed/cities_yakutia.csv"
    roads: "data/processed/graphs/roads_yakutia.graphml"
    railway: "data/processed/railway_yakutia.csv"
    power: "data/processed/power_yakutia.csv"
    territory: "data/processed/territory_yakutia.csv"
    traveltime: "data/processed/traveltime_yakutia.csv"
    science: "data/processed/science_yakutia.csv"
  # slug совпадает с ИКГС-регионом НАМЕРЕННО: это один и тот же регион с двумя
  # наборами ячеек (как у МО/Краснодара/Якутии). Фронт берёт по slug статику
  # novosibirsk_ikgs_*.geojson, менять его нельзя. Сетку/границу/города собрал
  # etl.build_grid (в 02_grid.ipynb НСО не готовили), дорожная сеть считается в
  # PostGIS по таблице road (graphml для НСО нет, берём road_lines из infra.json).
  - slug: novosibirsk_ikgs
    name: "Новосибирская область"
    object_name: "Новосибирская область"
    grid: "data/processed/grid_novosibirsk_1km_features.gpkg"
    border: "data/processed/border_novosibirsk.gpkg"
    cities: "data/processed/cities_novosibirsk.csv"
    roads_infra: "data/processed/novosibirsk_ikgs_infra.json"
    # csv-маски посчитаны scripts/compute_masks_overpass.py (без osmnx, прямые
    # запросы в Overpass + scipy) — те же σ и формулы, что у остальных регионов
    railway: "data/processed/railway_novosibirsk.csv"
    power: "data/processed/power_novosibirsk.csv"
    territory: "data/processed/territory_novosibirsk.csv"
    traveltime: "data/processed/traveltime_novosibirsk.csv"
    # научно-образовательная инфраструктура — 11-я маска, тот же скрипт
    science: "data/processed/science_novosibirsk.csv"

indicators:
  Y477090007:
    name: "Объём отгруженных товаров обрабатывающей промышленности"
    unit: "млрд руб."   # в parquet: "В фактически действовавших ценах, миллиардов рублей"
    # У этого кода в parquet четыре подраздела ОКВЭД на один object_name —
    # без фильтра ингест брал первую строку ("Водоснабжение...") вместо
    # обрабатывающих производств (Москва: 195 вместо 5275 млрд руб.).
    subsection: "Обрабатывающие производства"
    indicator_type: industrial
    elasticity: 2.77
    r2: 0.84
  Y477110039:
    name: "Внутренние затраты на исследования и разработки"
    unit: "млн руб."
    indicator_type: investment
    elasticity: 1.39
    r2: 0.77
  Y477110236:
    name: "Объём инновационных товаров"
    unit: "млн руб."
    indicator_type: industrial
    elasticity: 1.594
    r2: 0.53
  # Удельные показатели (ставки). rate_base — знаменатель ставки: её нельзя
  # делить между ячейками как объём, сохраняется взвешенное по этому знаменателю
  # среднее (см. миграцию 0013 и composition.distribute_rate).
  Y477110231:
    name: "Общие коэффициенты рождаемости"
    unit: "на 1000 чел."
    indicator_type: general
    rate_base: population
  Y477110196:
    name: "Коэффициенты естественного прироста населения на 1000 чел."
    unit: "на 1000 чел."
    indicator_type: general
    # Естественная убыль — отрицательное значение (МО −2,5, Краснодар −3,2,
    # НСО −3,5 за 2023; Якутия +3,4). Для ставки знак не особый случай.
    rate_base: population
  Y477110197:
    name: "Коэффициенты миграционного прироста на 10000 чел."
    unit: "на 10000 чел."
    indicator_type: general
    rate_base: population
  Y477110217:
    name: "Обеспеченность детей местами в дошкольных организациях"
    unit: "мест на 1000 детей"
    indicator_type: general
    # Истинный знаменатель — число детей; сетки детей нет, приближаем населением
    rate_base: population
  Y477140017:
    name: "Ввод в действие мощностей общеобразовательных организаций"
    unit: "ученических мест"
    indicator_type: general
  Y477110071:
    name: "Доходы консолидированных бюджетов субъектов Российской Федерации"
    unit: "млн руб."
    indicator_type: general
  Y477110226:
    name: "Общая площадь жилых помещений, приходящаяся в среднем на одного жителя"
    unit: "кв.м/чел."
    indicator_type: general
    rate_base: population
  Y477110211:
    name: "Мощность амбулаторно-поликлинических организаций: на 10000 чел."
    unit: "посещений в смену на 10000 чел."
    indicator_type: general
    rate_base: population
  # Научно-технологический блок. Коды выбрала Полина (d8f96a5, 9bf5833), но
  # положила только в src/masks/config.yaml — его рантайм не читает, поэтому в
  # БД показателей не было. Значения в массиве есть за 2023 по всем 4 регионам.
  Y477110309:
    name: "Подано патентных заявок на изобретения"
    unit: "единиц"
    indicator_type: general
  Y477110473:
    name: "Численность персонала НИОКР: исследователи"
    unit: "человек"
    indicator_type: general
  Y477110295:
    name: "Плотность автомобильных дорог с твёрдым покрытием"
    unit: "км на 1000 кв.км"
    indicator_type: general
    # Знаменатель — площадь, а не население (плотность на territory)
    rate_base: area
  Y477110259:
    name: "Организации, выполнявшие научные исследования и разработки"
    unit: "единиц"
    indicator_type: general
  Y477110176:
    name: "Используемые передовые производственные технологии"
    unit: "единиц"
    indicator_type: industrial
  # «местного производства» из ТЗ — это разработанные, а не используемые
  # технологии; Y477110176 закрывает только вторую половину пункта
  Y477110352:
    name: "Разработанные передовые производственные технологии"
    unit: "единиц"
    indicator_type: general
  # Ближайший доступный прокси к пункту ТЗ «объём поддержки организаций ВТНО»:
  # порталы по бюджету (budget.gov.ru) отдельной строки по ВТНО не публикуют, а
  # это — вся сумма, которую организации региона тратят на инновации, включая
  # бюджетную поддержку. Точную бюджетную часть без ручного разбора актов не
  # выделить, поэтому пункт закрыт частично.
  Y477110102:
    name: "Затраты на инновационную деятельность организаций"
    unit: "млн руб."
    indicator_type: industrial
  # БИЗ11 — удельный вес организаций, осуществлявших технологические инновации.
  # Это ставка (%), rate_base на численность населения (идеальный знаменатель —
  # число обследованных организаций — на уровне ячейки недоступен).
  Y477110144:
    name: "Удельный вес организаций, осуществлявших технологические инновации"
    unit: "%"
    indicator_type: general
    rate_base: population
  # СР73 — обеспеченность больничными койками (на 10000 чел.). Ставка, rate_base
  # на население. Y477110491 (не Y477110209 — это медианный доход, не койки).
  Y477110491:
    name: "Число больничных коек на 10000 человек населения"
    unit: "коек на 10000"
    indicator_type: general
    rate_base: population
  # СР42 — загрязнённость водных объектов. УКИЗВ (Росгидромет) в открытом
  # массиве нет; ближайший показатель — сброс загрязнённых сточных вод в
  # поверхностные водные объекты (млн м3). Обратный показатель.
  Y477110367:
    name: "Сброс загрязнённых сточных вод в поверхностные водные объекты"
    unit: "млн м3"
    indicator_type: general
  # ИНВ12 — инвестиции в технологическое обновление. В паркете это Y477050016
  # с несколькими подразделами ОКВЭД; берём «Обрабатывающие производства»
  # (строгие группы C 20-30 в паркете отдельно не публикуются, обрабатывающие
  # — ближайший открытый прокси).
  Y477050016:
    name: "Инвестиции в технологическое обновление (обрабатывающие производства)"
    unit: "млн руб."
    subsection: "В том числе по видам экономической деятельности: обрабатывающие производства"
    indicator_type: industrial
  # СР61 (культура — театры): численность зрителей театров на 1000. Ставка.
  Y477110450:
    name: "Численность зрителей театров на 1000 человек населения"
    unit: "на 1000"
    indicator_type: general
    rate_base: population
  # СР65 (культура — музеи): число посещений музеев на 1000. Ставка.
  Y477110451:
    name: "Число посещений музеев на 1000 человек населения"
    unit: "на 1000"
    indicator_type: general
    rate_base: population
  # СР62 (библиотеки) — библиотечный фонд на 1000 человек. Ставка.
  # Альтернатива opendata.mkrf: берём напрямую из паркета.
  Y477110227:
    name: "Библиотечный фонд общедоступных библиотек на 1000 человек населения"
    unit: "экз. на 1000"
    indicator_type: general
    rate_base: population
  # Капитальные затраты на НИР (из блока ИНВ по таблице Арсения). Объём.
  Y477110190:
    name: "Капитальные затраты на научные исследования и разработки"
    unit: "млн руб."
    indicator_type: industrial
  # Показатели, восстановленные после случайного форспуша 2026-10-11.
  Y477110441:
    name: "Численность врачей всех специальностей на 10000 человек населения"
    unit: "на 10000"
    indicator_type: general
    rate_base: population
  Y477110307:
    name: "Выдано патентов на изобретения"
    unit: "единиц"
    indicator_type: general
  Y477110476:
    name: "Численность профессорско-преподавательского персонала вузов"
    unit: "человек"
    indicator_type: general
  Y477100008:
    name: "Уровень безработицы населения"
    unit: "%"
    indicator_type: general
    rate_base: population
  Y477100010:
    name: "Уровень занятости населения"
    unit: "%"
    indicator_type: general
    rate_base: population
  Y477090017:
    name: "Энергоёмкость ВРП"
    unit: "кг у.т. на 10 тыс. руб."
    subsection: "В текущих ценах"
    indicator_type: general
  # ИНФ16 — степень износа основных фондов. Ставка (%): настоящий знаменатель —
  # стоимость ОФ, по ячейкам её нет; ближайшая база на сетке — население.
  Y477110390:
    name: "Степень износа основных фондов на конец года"
    unit: "%"
    indicator_type: general
    rate_base: population

# Показатели из CSV в data/raw/ (нет Y-кода в паркете — данные из fedstat/Trudvsem/
# opendata). Псевдо-код с префиксом C (CSV): C4770XXXX — первые 4 цифры код блока
# по ТЗ (ЧК, ИНВ, ИНФ, СР, БИЗ, НР → 1, 2, 5, 6, 3, 4 → C4771XXXX и т.д.).
# formula/source — для колонок J и K в таблице показателей.
csv_indicators:
  C4771001014:  # ЧК14
    name: "Кадровая потребность по видам экономической деятельности"
    unit: "вакансий"
    indicator_type: general
    csv_path: "data/raw/hh_vacancies_by_region.csv"
    formula: "Число открытых вакансий по ОКВЭД C+J+M / 1000 занятых"
    source: "Trudvsem opendata: https://opendata.trudvsem.ru/csv/vacancy.csv"
  C4771001023:  # ЧК23
    name: "Доля исследователей в возрасте до 39 лет"
    unit: "%"
    indicator_type: general
    csv_path: "data/raw/young_researchers_by_region.csv"
    formula: "Численность исследователей до 39 лет / Общая численность исследователей * 100"
    source: "Раздел «Наука» Росстата: https://rosstat.gov.ru/statistics/science"
  # ЧК22/ЧК24 собирает scripts/build_researchers_csv.py. Это ставки: rate_base
  # сохраняет взвешенное среднее вместо суммы. Настоящий знаменатель — число
  # исследователей, но по ячейкам его нет; ближайшая база на сетке — население.
  # Строка «Российская Федерация» в CSV -> national_total (шкала режима «Россия»).
  C4771001022:  # ЧК22
    name: "Удельный вес исследователей с учёной степенью кандидата или доктора наук"
    unit: "%"
    indicator_type: general
    rate_base: population
    csv_path: "data/raw/researchers_degree_share_by_region.csv"
    formula: "(Исследователи-доктора наук + кандидаты наук) / Общая численность исследователей * 100"
    source: "Росстат (форма 2-наука), parquet: Y477110454 / Y477110473"
  C4771001024:  # ЧК24 (= ЧК241; ЧК242 «из других субъектов РФ» — только ведомственный запрос)
    name: "Коэффициент обновления исследователей"
    unit: "на 1000 исследователей"
    indicator_type: general
    rate_base: population
    csv_path: "data/raw/researchers_renewal_per_1k_by_region.csv"
    formula: "Принято исследователей за год / Численность исследователей на конец года * 1000"
    source: "Форма 2-наука, табл. 4а_2 по ОКАТО: https://rosstat.gov.ru/storage/mediabank/2-nauka_2023.rar"
  # ИНВ11 — инвестиции в основной капитал ВТНО. Объём (млн руб.), не ставка,
  # поэтому rate_base не указан — разносится как сумма по маскам.
  C4771002011:  # ИНВ11
    name: "Инвестиции в основной капитал ВТНО"
    unit: "млн руб."
    indicator_type: general
    csv_path: "data/raw/vtno_investments_by_region.csv"
    formula: "Инвестиции в основной капитал по ОКВЭД C+J+M (из паркета Y477050016 с агрегацией по ВЭД)"
    source: "Сборник «Регионы России»: https://rosstat.gov.ru/folder/210/document/13204"
  # СР34, СР35 — счётчики объектов транспортной инфраструктуры по региону.
  # Это объёмы (штуки), не ставки — rate_base не указан. По Якутии ЖД-станций
  # Wikidata не нашла, в CSV её нет — показатель просто пропустится для региона.
  C4771006034:  # СР34
    name: "Доступность железнодорожных станций"
    unit: "станций"
    indicator_type: general
    csv_path: "data/raw/rail_stations_by_region.csv"
    formula: "Число железнодорожных станций (usage=main) в регионе из OSM/Wikidata"
    source: "Wikidata SPARQL: https://query.wikidata.org, OpenStreetMap: https://www.openstreetmap.org"
  C4771006035:  # СР35
    name: "Доступность аэропортов"
    unit: "аэропортов"
    indicator_type: general
    csv_path: "data/raw/airports_by_region.csv"
    formula: "Число крупных пассажирских аэропортов в регионе"
    source: "OurAirports: https://ourairports.com/data"
  # СР41, СР43, СР44, СР52, СР53 — удельные показатели. CSV собирает
  # scripts/build_per_capita_csv.py: значение из паркета / численность населения
  # (Y477110461) за тот же год.
  C4771006041:  # СР41
    name: "Выбросы загрязняющих веществ от стационарных источников на жителя"
    unit: "кг/чел"
    indicator_type: general
    rate_base: population
    csv_path: "data/raw/emissions_per_capita_by_region.csv"
    formula: "Выбросы от стационарных источников (Y477110053) / Численность населения"
    source: "Росстат, «Регионы России»: https://rosstat.gov.ru/folder/210/document/13204"
  C4771006043:  # СР43
    name: "Образование отходов производства и потребления на жителя"
    unit: "кг/чел"
    indicator_type: general
    rate_base: population
    csv_path: "data/raw/waste_generated_per_capita_by_region.csv"
    formula: "Образование отходов (Y477070020) / Численность населения"
    source: "Росстат, «Регионы России»: https://rosstat.gov.ru/folder/210/document/13204"
  C4771006044:  # СР44
    name: "Утилизация и обезвреживание отходов на жителя"
    unit: "кг/чел"
    indicator_type: general
    rate_base: population
    csv_path: "data/raw/waste_utilized_per_capita_by_region.csv"
    formula: "Утилизированные и обезвреженные отходы (Y477070020) / Численность населения"
    source: "Росстат, «Регионы России»: https://rosstat.gov.ru/folder/210/document/13204"
  C4771006052:  # СР52
    name: "Спортивные залы на 100 тыс. жителей"
    unit: "на 100 тыс. чел"
    indicator_type: general
    rate_base: population
    csv_path: "data/raw/sport_halls_per_100k_by_region.csv"
    formula: "Число спортивных залов (Y477110502) / Численность населения * 100 000"
    source: "Росстат, «Регионы России»: https://rosstat.gov.ru/folder/210/document/13204"
  C4771006053:  # СР53
    name: "Плоскостные спортивные сооружения на 100 тыс. жителей"
    unit: "на 100 тыс. чел"
    indicator_type: general
    rate_base: population
    csv_path: "data/raw/sport_grounds_per_100k_by_region.csv"
    formula: "Плоскостные спортивные сооружения (Y477110501) / Численность населения * 100 000"
    source: "Росстат, «Регионы России»: https://rosstat.gov.ru/folder/210/document/13204"
  # Блок 5 ТЗ — инфраструктура (ИНФ12–ИНФ18). ИНФ12/ИНФ13 собирают скрипты
  # scripts/build_universities_csv.py (Wikidata + паркет) и build_ckp_csv.py
  # (ckp-rf.ru + перечень ПИШ), ИНФ15 — build_fixed_assets_csv.py, ИНФ18 — CSV,
  # собранный вручную. ИНФ14 и ИНФ17 — открытых данных нет.
  C4771005012:  # ИНФ12
    name: "Число организаций высшего образования на 100 тыс. жителей"
    unit: "на 100 тыс."
    indicator_type: general
    rate_base: population
    csv_path: "data/raw/universities_per_100k_by_region.csv"
    formula: "Число вузов (Wikidata, головные организации) / Численность населения * 100 000"
    source: "Wikidata SPARQL: https://query.wikidata.org; население — паркет Y477110373"
  # ИНФ13 — счётчик объектов (объём), не ставка: rate_base не указан.
  C4771005013:  # ИНФ13
    name: "Объекты научно-технологической инфраструктуры (ЦКП, УНУ, ПИШ)"
    unit: "объектов"
    indicator_type: general
    csv_path: "data/raw/nti_objects_by_region.csv"
    formula: "Число ЦКП + УНУ (ckp-rf.ru) + передовых инженерных школ по региону; лаборатории без реестра не входят"
    source: "ckp-rf.ru: https://ckp-rf.ru/catalog/; ПИШ — отборы Минобрнауки 2022/2023"
  C4771005015:  # ИНФ15
    name: "Коэффициент обновления основных фондов"
    unit: "%"
    indicator_type: general
    rate_base: population
    csv_path: "data/raw/fixed_assets_renewal_by_region.csv"
    formula: "Ввод в действие основных фондов / Наличие основных фондов на конец года * 100"
    source: "Росстат (паркет): Y477110029 / Y477110391"
  C4771005018:  # ИНФ18
    name: "Удельный вес машин и оборудования в возрасте до 5 лет"
    unit: "%"
    indicator_type: general
    rate_base: population
    csv_path: "data/raw/tech_under_5_years_by_region.csv"
    formula: "Стоимость машин и оборудования до 5 лет / Общая стоимость машин и оборудования * 100"
    source: "Раздел «Наука» Росстата: https://rosstat.gov.ru/statistics/science"

# Итоговая композиция (как у Полины) + конфигурации ablation (§9.5 ТЗ).
final_weights:
  regression: 0.5
  worldpop: 0.3
  distance_to_city: 0.1
  distance_to_center: 0.1

ablation:
  - label: "all_5_masks"
    masks: [regression, worldpop, distance_to_city, distance_to_center]
    weights: {regression: 0.5, worldpop: 0.3, distance_to_city: 0.1, distance_to_center: 0.1}
  - label: "no_regression"
    masks: [worldpop, distance_to_city, distance_to_center]
    weights: {worldpop: 0.5, distance_to_city: 0.25, distance_to_center: 0.25}
  - label: "no_worldpop"
    masks: [regression, distance_to_city, distance_to_center]
    weights: {regression: 0.7, distance_to_city: 0.15, distance_to_center: 0.15}
  - label: "no_distance_to_city"
    masks: [regression, worldpop, distance_to_center]
    weights: {regression: 0.6, worldpop: 0.3, distance_to_center: 0.1}
  - label: "no_distance_to_center"
    masks: [regression, worldpop, distance_to_city]
    weights: {regression: 0.6, worldpop: 0.3, distance_to_city: 0.1}
  - label: "only_regression"
    masks: [regression]
    weights: null
  - label: "only_worldpop"
    masks: [worldpop]
    weights: null
  - label: "only_baseline"
    masks: [baseline]
    weights: null

distances:
  city_sigma_km: 10.0
  center_sigma_km: 30.0
