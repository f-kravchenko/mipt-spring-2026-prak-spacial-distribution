name: Run index ETL

on:
  workflow_dispatch:

concurrency:
  group: production-etl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-index-etl:
    name: Update index layers on VDS
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: production

    steps:
      - name: Run index ETL on VDS
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
          VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
          VDS_KNOWN_HOSTS: ${{ secrets.VDS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VDS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VDS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

          ssh -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            "$VDS_USER@$VDS_HOST" \
            'cd /opt/mipt-deaggr/app && \
             flock -n /run/lock/mipt-deaggr-etl.lock \
             ./deploy/vds/run-etl-index.sh'
