name: build-and-publish

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  OWNER: f-kravchenko

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/spatial-masks
      - run: helm template demo deploy/helm/spatial-masks > /dev/null

  images:
    runs-on: ubuntu-latest
    needs: helm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: db
            context: db
            dockerfile: db/Dockerfile
          - name: api
            context: apps/api
            dockerfile: apps/api/Dockerfile
          - name: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
          - name: etl
            context: .
            dockerfile: Dockerfile.etl
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/spatial-masks-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/spatial-masks-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
